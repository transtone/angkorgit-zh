name: 同步并汉化（PR）

# 手动触发：合并上游 → 应用词库 → 混排文案检查 → 开一个 PR。
# 不直接推 main、不发布。人工在 PR 里补齐/修正翻译，CI 通过后再合并。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '可选：同步后统一升级版本号 x.y.z（留空则不改）'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: localize
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config user.name "angkorgit-zh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 记录上游提交清单
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/cheat2001/angkorgit.git
          git fetch upstream main --tags --force
          git log --oneline HEAD..upstream/main > "$RUNNER_TEMP/upstream.txt"
          if [ -s "$RUNNER_TEMP/upstream.txt" ]; then
            echo "need_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "need_merge=false" >> "$GITHUB_OUTPUT"
          fi
        id: upstream

      - name: 合并上游并恢复自维护文件
        shell: pwsh
        run: |
          $pre = (git rev-parse HEAD).Trim()
          if ('${{ steps.upstream.outputs.need_merge }}' -eq 'true') {
            git merge upstream/main -X theirs --no-edit
          } else {
            Write-Output "已包含上游最新提交。"
          }
          git checkout $pre -- README.md docs apps/website
          $pub = (Get-Content -Raw zh-dict/updater-pubkey.txt).Trim()
          $conf = 'apps/desktop/src-tauri/tauri.conf.json'
          $raw = Get-Content -Raw $conf
          $raw = [regex]::Replace($raw, '"pubkey": "[^"]*"', ('"pubkey": "' + $pub + '"'))
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE $conf), $raw, (New-Object System.Text.UTF8Encoding($false)))
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: 合并上游并恢复中文 README、docs 与网站" --no-verify
          }

      - name: 应用词库
        shell: pwsh
        env:
          BUMP_VERSION: ${{ inputs.version }}
        run: |
          $scriptArgs = @('-NoProfile', '-File', 'scripts/sync-localize.ps1', '-Repo', "$env:GITHUB_WORKSPACE", '-SkipSync')
          if ($env:BUMP_VERSION) { $scriptArgs += @('-BumpVersion', $env:BUMP_VERSION) }
          pwsh @scriptArgs

      - name: 混排文案检查
        id: copycheck
        continue-on-error: true
        run: node scripts/check-copy.mjs > "$RUNNER_TEMP/copycheck.txt" 2>&1

      - name: 词典检查
        id: dictcheck
        continue-on-error: true
        run: node scripts/check-dict.mjs > "$RUNNER_TEMP/dictcheck.txt" 2>&1

      - name: 整理待译清单
        id: pending
        run: |
          if [ -f zh-dict/pending.tsv ]; then
            grep -vc '^#' zh-dict/pending.tsv > "$RUNNER_TEMP/pending-count.txt" || true
          else
            echo 0 > "$RUNNER_TEMP/pending-count.txt"
          fi
          echo "待译/待确认条目：$(cat "$RUNNER_TEMP/pending-count.txt")"

      - name: 保存待译清单
        uses: actions/upload-artifact@v4
        with:
          name: pending-strings
          path: zh-dict/pending.tsv
          if-no-files-found: ignore

      - name: 生成 PR 说明
        run: |
          {
            echo "## 自动同步 + 汉化结果"
            echo
            echo "本 PR 由「同步并汉化（PR）」工作流生成。合并上游后应用了 \`zh-dict/dict.tsv\`。"
            echo
            echo "### 上游提交"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/upstream.txt"
            echo '```'
            echo
            echo "### 混排文案检查（\`bun run check:copy\`）"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/copycheck.txt" 2>/dev/null || echo "（未生成）"
            echo '```'
            echo
            echo "### 词典检查（\`bun run check:dict\`）"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/dictcheck.txt" 2>/dev/null || echo "（未生成）"
            echo '```'
            echo
            echo "### 待译/待确认条目：$(cat "$RUNNER_TEMP/pending-count.txt") 条"
            echo
            echo "完整清单见本次运行的 **pending-strings** 构建产物（\`zh-dict/pending.tsv\`，已用 .gitignore 排除，不再提交）。"
            echo
            echo "### 合并前请确认"
            echo
            echo "- [ ] \`bun run check:copy\` 干净（无半中半英）"
            echo "- [ ] \`bun run typecheck && bun run test\` 通过"
            echo "- [ ] \`bun run test:e2e\` 通过（由本 PR 的 CI 执行）"
            echo "- [ ] 新增英文串已补进 \`zh-dict/dict.tsv\`"
          } > "$RUNNER_TEMP/pr-body.md"

      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          branch: sync/upstream-${{ github.run_id }}
          base: main
          title: 'chore(i18n): 同步上游并汉化'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: upstream-sync
          delete-branch: true
