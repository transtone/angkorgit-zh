name: 发布中文版

# 推送版本 tag 后检查版本、运行测试，再构建并发布签名的 Windows 安装包。
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-zh
  cancel-in-progress: false

jobs:
  verify:
    name: 测试
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 检查 updater 签名密钥
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '::error::请先设置仓库 Secret TAURI_SIGNING_PRIVATE_KEY，并将对应公钥写入 tauri.conf.json。'
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: tag 版本号与仓库一致
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          bun -e '
            const tag = process.env.TAG_NAME;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error("版本 tag 格式应为 vX.Y.Z");
            const version = tag.slice(1);
            const base = "apps/desktop/src-tauri/";
            const versions = {
              "package.json": (await Bun.file("package.json").json()).version,
              "apps/desktop/package.json": (await Bun.file("apps/desktop/package.json").json()).version,
              "tauri.conf.json": (await Bun.file(base + "tauri.conf.json").json()).version,
              "Cargo.toml": Bun.TOML.parse(await Bun.file(base + "Cargo.toml").text()).package.version,
              "Cargo.lock": Bun.TOML.parse(await Bun.file(base + "Cargo.lock").text()).package.find(p => p.name === "angkorgit").version,
            };
            for (const [file, actual] of Object.entries(versions)) {
              if (actual !== version) throw new Error(`${file} 版本 ${actual} 与 tag ${tag} 不一致，请先合并版本升级。`);
            }
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
            console.log(`版本检查通过：${version}`);
          '
      - name: 检查 tag（允许同一提交重试）
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="refs/tags/v$VERSION"
          if git show-ref --verify --quiet "$tag"; then
            commit=$(git rev-parse "$tag^{}")
            if [ "$commit" != "$(git rev-parse HEAD)" ]; then
              echo "::error::tag v$VERSION 已指向其他提交，请升级版本号；不会移动现有 tag。"
              exit 1
            fi
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check:copy
      - run: bun run check:dict
      - run: bun run --filter '*' typecheck
      - run: bun run test
      - run: bun run test:localize
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: 保存失败测试证据
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: test-results/
          if-no-files-found: ignore

  build:
    name: 构建并发布（Windows）
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - name: 使用原生 Windows Perl 构建 OpenSSL
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) {
            $perl = Get-Command perl -CommandType Application -All | Where-Object {
              $_.Source -notmatch '[\\/]Git[\\/]' -and (& $_.Source -e 'print $^O') -eq 'MSWin32'
            } | Select-Object -First 1 -ExpandProperty Source
          }
          if (-not $perl -or (& $perl -e 'print $^O') -ne 'MSWin32') {
            throw 'Windows runner 缺少原生 Windows Perl（例如 Strawberry Perl），无法构建 OpenSSL。'
          }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path $perl) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Rust 测试
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: 构建安装包（NSIS + MSI，含 updater 签名）
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri:build --bundles nsis,msi
      - name: 整理安装包、签名、updater 清单与 SHA256SUMS
        shell: pwsh
        env:
          NOTES: ''
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/target/release/bundle'
          $exe = @(Get-ChildItem (Join-Path $bundle 'nsis') -Filter *.exe)
          $msi = @(Get-ChildItem (Join-Path $bundle 'msi') -Filter *.msi)
          if ($exe.Count -ne 1 -or $msi.Count -ne 1) { throw '预期恰好一个 NSIS 和一个 MSI 安装包。' }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          foreach ($installer in @($exe[0], $msi[0])) {
            $signature = $installer.FullName + '.sig'
            if (-not (Test-Path $signature) -or -not (Get-Content -Raw $signature).Trim()) {
              throw "缺少 updater 签名：$signature"
            }
            Copy-Item $installer.FullName, $signature release/
          }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION/$([uri]::EscapeDataString($exe[0].Name))"
          $json = @{
            version   = $env:VERSION
            notes     = "AngKorGit 中文版 v$env:VERSION`n$env:NOTES"
            pub_date  = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{ 'windows-x86_64' = @{
              signature = (Get-Content -Raw ($exe[0].FullName + '.sig')).Trim()
              url = $url
            } }
          } | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText((Join-Path $PWD 'release/latest.json'), $json)
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Path release/SHA256SUMS -Encoding utf8NoBOM
          $body = @"
          ## AngKorGit 中文版 v$env:VERSION

          $env:NOTES

          ### 安装
          - Windows x64 NSIS：$($exe[0].Name)
          - Windows x64 MSI：$($msi[0].Name)

          ### 说明
          - 安装包未做商业代码签名，SmartScreen 首次运行请选择“更多信息 → 仍要运行”。
          - 应用内自动更新指向本仓库 Releases 的 latest.json，更新包带有 updater 签名。
          - SHA256SUMS 提供安装包、签名文件和 latest.json 的 SHA-256 校验值。
          - 源码提交：$env:GITHUB_SHA
          "@
          $body | Set-Content -Path release-notes.md -Encoding utf8NoBOM
      - name: 保存发布产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ needs.verify.outputs.version }}
          path: release/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AngKorGit 中文版 v${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release/*.exe
            release/*.exe.sig
            release/*.msi
            release/*.msi.sig
            release/latest.json
            release/SHA256SUMS
