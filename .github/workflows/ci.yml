name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject tool-generated trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(co-authored-by:.*(cursor|claude|copilot|codex|gemini|openai|anthropic|chatgpt|devin|aider|windsurf|cline)|generated (with|by) |🤖)'
          bad=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if git log -1 --format=%B "$c" | grep -qiE "$pattern"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") carries a tool-generated trailer"
              git log -1 --format=%B "$c" | grep -iE "$pattern" | sed 's/^/    /'
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo
            echo "Commits in this repository carry no trailers from coding tools. Amend or squash them away, then push again."
            exit 1
          fi

  frontend:
    name: Typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check:copy
      - run: bun run check:dict
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:localize
      - run: bun run --filter @angkorgit/desktop build

  e2e:
    name: Playwright (demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Save failed test evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

  rust:
    name: Rust engine (check, clippy, git integration tests)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
